name: Feature request
description: Something you'd like Vanta to do
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like Vanta to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
      description: Your setup and what you are trying to get done.
